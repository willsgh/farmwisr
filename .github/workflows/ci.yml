name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build web app
        run: npx expo export --platform web
        working-directory: apps/mobile

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: farmwisr
    steps:
      - uses: actions/checkout@v4
      # The postgis image pre-installs PostGIS in the public schema of its default databases;
      # start from template0 so the migration installs it into `extensions`, as on Supabase.
      - name: Create a clean database
        run: createdb -T template0 farmwisr
      - name: Apply migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci_auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Check row-level security
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
